[project]
name = "matchday"
version = "0.1.0"
description = "Football predictions with friends, shipped through a full CI/CD and GitOps pipeline"
authors = [
    { name = "Michal Jakubowski", email = "michal_jakubowski@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
matchday = "matchday.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is how pytest checks things

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]  # fixed test passwords

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
